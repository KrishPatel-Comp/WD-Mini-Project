services:
  # ─── Web Application (PHP 8.2 + Apache) ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unibridge_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-unibridge}
      DB_USER: ${DB_USER:-unibridge}
      DB_PASS: ${DB_PASSWORD:-unibridge_secret_pass}
    volumes:
      - app_uploads:/var/www/html/uploads
      - backend_uploads:/var/www/html/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  # ─── Database (MariaDB 11.4) ────────────────────────────────────
  db:
    image: mariadb:11.4
    container_name: unibridge_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-unibridge}
      MYSQL_USER: ${DB_USER:-unibridge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-unibridge_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Database Management (phpMyAdmin) ──────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: unibridge_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    name: unibridge_db_data
  app_uploads:
    name: unibridge_app_uploads
  backend_uploads:
    name: unibridge_backend_uploads
